<!doctype html>
<html lang="es">

<head>
  <title>
    <%= productName %>
  </title>

  <meta charset="utf-8" />
  <meta name="description" content="<%= productDescription %>" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />
  <meta name="viewport"
    content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width<% if (ctx.mode.cordova || ctx.mode.capacitor) { %>, viewport-fit=cover<% } %>" />

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="G3 Ingeniería" />

  <meta name="theme-color" content="#ffffff" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.g3innovaciones.com/" />
  <meta property="og:title" content="G3 Ingeniería" />
  <meta property="og:description"
    content="G3 Ingeniería ofrece soluciones integrales en automatización e innovación. Desde el levantamiento hasta el objetivo del cliente, ofrecemos servicios de ingeniería de campo y desarrollo de software. ¡Descubre cómo transformamos tus proyectos!" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.g3innovaciones.com/" />
  <meta property="twitter:title" content="G3 Ingeniería" />
  <meta property="twitter:description"
    content="G3 Ingeniería ofrece soluciones integrales en automatización e innovación. Desde el levantamiento hasta el objetivo del cliente, ofrecemos servicios de ingeniería de campo y desarrollo de software. ¡Descubre cómo transformamos tus proyectos!" />
  <meta property="twitter:image" content="g3seo.png" />

  <!-- Microdatos para G3 Ingeniería -->
  <div itemscope itemtype="http://schema.org/Organization" hidden>
    <span itemprop="name">G3 Ingeniería</span>
    <span itemprop="description">Automatización e Innovación en Proyectos de Ingeniería</span>
    <span itemprop="address" itemscope itemtype="http://schema.org/PostalAddress">
      <span itemprop="streetAddress">Villa Hidalgo y/o Oputo 64, Col. Los Cuatro Olivos</span>
      <span itemprop="addressLocality">Hermosillo</span>
      <span itemprop="addressRegion">Sonora</span>
      <span itemprop="postalCode">83104</span>
    </span>
    <span itemprop="telephone">+52 662 688 86 06</span>
    <span itemprop="email">contacto@g3ingenieria.com</span>
    <span itemprop="logo" itemscope itemtype="http://schema.org/ImageObject">
      <img src="g3seo.png" alt="Logo de G3 Ingeniería" itemprop="url" />
    </span>
  </div>
</head>

<body>

    <div class="loading-text">

      <span class="loading-text-words">L</span>
      <span class="loading-text-words">E</span>
      <span class="loading-text-words">A</span>
      <span class="loading-text-words">S</span>
      <span class="loading-text-words">E</span>
      <span class="loading-text-words"> </span>
      <span class="loading-text-words">W</span>
      <span class="loading-text-words">A</span>
      <span class="loading-text-words">I</span>
      <span class="loading-text-words">T</span>
    </div>
    <span class="loader"></span>
    <div class="loading-text">
      <span class="loading-text-words">L</span>
      <span class="loading-text-words">O</span>
      <span class="loading-text-words">A</span>
      <span class="loading-text-words">D</span>
      <span class="loading-text-words">I</span>
      <span class="loading-text-words">N</span>
      <span class="loading-text-words">G</span>
    </div>
    <div class="loading-text">
      <span class="loading-text-words">G</span>
      <span class="loading-text-words">+</span>
      <span class="loading-text-words">B</span>
      <span class="loading-text-words">L</span>
      <span class="loading-text-words">A</span>
      <span class="loading-text-words">S</span>
      <span class="loading-text-words">T</span>
    </div>
  </div>

  <script>
    // Leer preferencias del localStorage
    const preferenciasIndex = JSON.parse(localStorage.getItem('preferencias'))

    // Obtener el tema actual
    const temaActual = preferenciasIndex?.temas?.valor?.value || 'tema-aceites'

    // Aplicar el tema actual al cuerpo de la página
    document.body.setAttribute('datos-tema', temaActual)
  </script>

  <!-- DO NOT touch the following DIV -->
  <!-- <div id="q-app"/> -->
  <!-- quasar:entry-point -->
</body>

<style>
  @import url(https://fonts.googleapis.com/css?family=Quattrocento+Sans);

  .centrarDiv {
    width: 100dvw;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background-color: var(--q-primary, #fff);
    position: absolute;
    top: 0;
    left: 0;
    overflow: hidden;
    transition: background-color 0.25s ease-in-out;
  }

  /* LOADING CAR */
  .loader {
    position: relative;
    width: 164px;
    height: 164px;
    border-radius: 50%;
    animation: rotate 1.5s linear infinite;
    margin-bottom: 30px;
    margin-top: 30px;
  }

  .loader::before {
    content: '';
    position: absolute;
    width: 20px;
    height: 40px;
    border: 1px solid var(--q-textprimary, #37474f);
    border-width: 12px 2px 7px;
    border-radius: 2px 2px 1px 1px;
    box-sizing: border-box;
    transform: rotate(45deg) translate(24px, -10px);
    background-image:
      linear-gradient(var(--q-fondo, #37474f) 20px, transparent 0),
      linear-gradient(var(--q-textprimary, #37474f) 30px, transparent 0),
      linear-gradient(var(--q-textprimary, #37474f) 30px, transparent 0);
    background-size:
      10px 12px,
      1px 30px,
      1px 30px;
    background-repeat: no-repeat;
    background-position:
      center,
      12px 0px,
      3px 0px;
    transition:
      border-color 0.5s ease-in-out,
      background-color 0.5s ease-in-out;
  }

  .loader::after {
    content: '';
    position: absolute;
    height: 4px;
    width: 4px;
    left: 20px;
    top: 47px;
    border-radius: 50%;
    color: var(--q-textprimary, #37474f);
    box-shadow:
      -4px 7px 2px,
      -7px 16px 3px 1px,
      -11px 24px 4px 1px,
      -6px 24px 4px 1px,
      -14px 35px 6px 2px,
      -5px 36px 8px 2px,
      -5px 45px 8px 2px,
      -14px 49px 8px 2px,
      6px 60px 11px 1px,
      -11px 66px 11px 1px,
      11px 75px 13px,
      -1px 82px 15px;
    transition: box-shadow 0.5s ease-in-out;
  }

  @keyframes rotate {
    from {
      transform: rotate(0deg);
    }

    to {
      transform: rotate(360deg);
    }
  }

  /* LOADING TEXT */

  .loading-text {
    text-align: center;
    width: 100%;
    height: auto;
    line-height: 30px;
  }

  .loading-text span {
    display: inline-block;
    margin: 0 5px;
    color: var(--q-textprimary, #37474f);
    font-family: 'Quattrocento Sans', sans-serif;
    font-weight: bold;
    transition: color 0.5s ease-in-out;
  }

  .loading-text span:nth-child(1) {
    filter: blur(0px);
    animation: blur-text 1.2s 0s infinite linear alternate;
  }

  .loading-text span:nth-child(2) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.1s infinite linear alternate;
  }

  .loading-text span:nth-child(3) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.2s infinite linear alternate;
  }

  .loading-text span:nth-child(4) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.3s infinite linear alternate;
  }

  .loading-text span:nth-child(5) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.4s infinite linear alternate;
  }

  .loading-text span:nth-child(6) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.5s infinite linear alternate;
  }

  .loading-text span:nth-child(7) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.6s infinite linear alternate;
  }

  .loading-text span:nth-child(8) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.7s infinite linear alternate;
  }

  .loading-text span:nth-child(9) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.8s infinite linear alternate;
  }

  .loading-text span:nth-child(10) {
    filter: blur(0px);
    animation: blur-text 1.2s 0.9s infinite linear alternate;
  }

  .loading-text span:nth-child(11) {
    filter: blur(0px);
    animation: blur-text 1.2s 1s infinite linear alternate;
  }

  .loading-text span:nth-child(12) {
    filter: blur(0px);
    animation: blur-text 1.2s 1.1s infinite linear alternate;
  }

  @keyframes blur-text {
    0% {
      filter: blur(0px);
      opacity: 1;
    }

    50% {
      filter: blur(2px);
      opacity: 0.8;
    }

    100% {
      filter: blur(4px);
      opacity: 0.6;
    }
  }
</style>

</html>
